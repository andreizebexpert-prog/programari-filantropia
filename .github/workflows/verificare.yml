name: Verificare programari Filantropia

on:
  schedule:
    # Porneste o rulare la ~10 minute. Fiecare rulare sta activa ~25 minute,
    # verifica site-ul la fiecare minut si raspunde la comenzile din Telegram.
    # Urmatoarea rulare asteapta la coada si porneste imediat cand se termina
    # cea curenta, deci verificarea e practic continua.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      specialty:
        description: "TEST - specialty (lasa gol pentru verificarea normala)"
        required: false
      service:
        description: "TEST - service"
        required: false
      doctor:
        description: "TEST - doctor"
        required: false

permissions:
  contents: write

concurrency:
  group: verificare-${{ inputs.doctor || 'principal' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verifica locurile libere
        run: python3 check_slots.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          SPECIALTY: ${{ inputs.specialty }}
          SERVICE: ${{ inputs.service }}
          DOCTOR: ${{ inputs.doctor }}
          TEST_MODE: ${{ inputs.doctor }}

      - name: Salveaza starea
        if: ${{ always() && !inputs.doctor }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Actualizare stare"
          git pull --rebase -X theirs || true
          git push
