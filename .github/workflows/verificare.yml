name: Verificare programari Filantropia

on:
  schedule:
    # Doar plasa de siguranta: porneste lantul din nou daca s-a oprit.
    # GitHub ruleaza aceste programari foarte neregulat (uneori la ore distanta).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      specialty:
        description: "TEST - specialty (lasa gol pentru verificarea normala)"
        required: false
      service:
        description: "TEST - service"
        required: false
      doctor:
        description: "TEST - doctor"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: verificare-${{ inputs.doctor || 'principal' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Verifica locurile libere
        run: python3 check_slots.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          LOOP_MINUTES: "55"
          INTERVAL_SECONDS: "30"
          SPECIALTY: ${{ inputs.specialty }}
          SERVICE: ${{ inputs.service }}
          DOCTOR: ${{ inputs.doctor }}
          TEST_MODE: ${{ inputs.doctor }}

      - name: Salveaza starea
        if: ${{ always() && !inputs.doctor }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Actualizare stare"
          git pull --rebase -X theirs || true
          git push

      # Porneste imediat urmatoarea rulare, ca verificarea sa nu aiba pauze.
      - name: Porneste urmatoarea rulare
        if: ${{ always() && !inputs.doctor && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verificare.yml --ref "${{ github.ref_name }}"
